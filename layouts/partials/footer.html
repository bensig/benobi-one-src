<footer class="footer">
  <section class="container">
    {{ with .Site.Params.social }}
    <ul class="social-list footer-social">
      {{ range sort . "weight"}}
        <li class="social-item">
          <a href="{{ .url }}" aria-label="{{ .name }}" {{ if .rel }}rel="{{ .rel }}"{{ end }}>
            {{ if .icon }}
              <i class="{{ .icon }}" aria-hidden="true"></i>
            {{ else }}
              {{ .name }}
            {{ end }}
          </a>
        </li>
      {{ end }}
      <li class="social-item llms-item">
        <a href="{{ "llms.txt" | absURL }}" aria-label="llms.txt — machine-readable summary of this site for AI agents" title="llms.txt — for the robots" rel="alternate" type="text/plain">
          <i class="fas fa-robot" aria-hidden="true"></i>
        </a>
      </li>
    </ul>
    {{ end }}
    {{ if not .Site.Params.hideCopyright }} <p>© {{ .Site.LastChange.Format "2006" }} {{ .Site.Params.author }}</p> {{ end }}
  </section>
</footer>
